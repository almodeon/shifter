<!DOCTYPE html>
<html>
<head>
    <title>Login - Shifter</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            height: 100vh;
        }
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-panel {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            padding: 36px 32px 28px 32px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .login-title {
            font-size: 26px;
            font-weight: bold;
            color: #007cba;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
        }
        .login-form input[type="password"] {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #bbb;
            border-radius: 5px;
            margin-bottom: 16px;
            width: 220px;
            text-align: center;
        }
        .login-form button {
            background: #007cba;
            color: white;
            border: none;
            padding: 10px 28px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .login-form button:hover {
            background: #005a87;
        }
        .login-error {
            color: #c62828;
            background: #ffebee;
            border-radius: 4px;
            padding: 7px 12px;
            margin-bottom: 10px;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-panel">
            <div class="login-title">🏥 Shifter</div>
            <div style="color:#555; font-size:13px; margin-bottom:18px; text-align:center;">
                A lightweight tool for scheduling small teams. (pre-alpha)
            </div>
            <form class="login-form" method="post">
                {% if error %}
                <div class="login-error">{{ error }}</div>
                {% endif %}
                <input type="password" name="pin" placeholder="Enter PIN" autofocus required>
                <br>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
